services:
mysql:
image: mysql:8.4
container_name: mysql-acopio
restart: unless-stopped
ports:
- "127.0.0.1:3306:3306"
environment:
MYSQL_ROOT_PASSWORD: root123
MYSQL_DATABASE: acopio
MYSQL_USER: acopio
MYSQL_PASSWORD: acopio123
volumes:
- mysql_data:/var/lib/mysql
networks:
- laravel-network

app:
  build: .
  image: acopio-leche:latest
  container_name: acopio-leche
  restart: unless-stopped
  ports:
    - "127.0.0.1:8080:8080"
  env_file:
    - .env
  depends_on:
    - mysql
  networks:
    - laravel-network

volumes:
mysql_data:

networks:
laravel-network:
external: true